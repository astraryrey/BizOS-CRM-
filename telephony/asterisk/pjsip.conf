;==============================================================================
; Two SIP accounts for testing: 6001 = "caller", 6002 = "operator".
; Passwords are trivial on purpose: this is a local sandbox that is not
; exposed to the outside world.
;==============================================================================
[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060
; Docker on a Mac puts the container behind NAT, so spell out which
; networks count as local.
local_net = 172.16.0.0/12
local_net = 192.168.0.0/16
local_net = 10.0.0.0/8

[6001]
type = endpoint
context = incoming
disallow = all
allow = ulaw
allow = alaw
auth = 6001-auth
aors = 6001
; Change this number to pretend the call comes from a different customer.
callerid = Test caller <380671112233>
direct_media = no

[6001-auth]
type = auth
auth_type = userpass
username = 6001
password = test6001

[6001]
type = aor
max_contacts = 2
remove_existing = yes

[6002]
type = endpoint
context = incoming
disallow = all
allow = ulaw
allow = alaw
auth = 6002-auth
aors = 6002
callerid = Operator <6002>
direct_media = no

[6002-auth]
type = auth
auth_type = userpass
username = 6002
password = test6002

[6002]
type = aor
max_contacts = 2
remove_existing = yes
