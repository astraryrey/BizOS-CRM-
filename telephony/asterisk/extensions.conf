;==============================================================================
; There is one line that matters here: System(curl .../api/telephony/incoming)
; That is what tells BizOS the caller's number as the call arrives.
; Everything else is scaffolding so the call connects at all.
;==============================================================================
[globals]
; Inside the container "localhost" means the container itself, not your Mac.
BIZOS = http://host.docker.internal:8000
; Which business this line serves: 1=garage, 2=salon, 3=vet clinic
TENANT = 1

[incoming]

; Dial 100 = call the business
exten => 100,1,NoOp(=== INCOMING from ${CALLERID(num)} ===)
 ; Tell BizOS who is calling. The trailing & means "do not wait" - the
 ; call must never be delayed by our request.
 same => n,System(curl -s -m 2 -X POST "${BIZOS}/api/telephony/incoming?phone=${CALLERID(num)}&tenant_id=${TENANT}&call_id=${UNIQUEID}" > /dev/null &)
 same => n,Wait(1)
 same => n,Dial(PJSIP/6002,30)
 same => n,Hangup()

; 101/102/103 = a call into a specific business. This is how separate
; public numbers are told apart in reality.
exten => _10[123],1,NoOp(=== INCOMING on line ${EXTEN} from ${CALLERID(num)} ===)
 same => n,Set(T=${IF($["${EXTEN}"="101"]?1:${IF($["${EXTEN}"="102"]?2:3)})})
 same => n,System(curl -s -m 2 -X POST "${BIZOS}/api/telephony/incoming?phone=${CALLERID(num)}&tenant_id=${T}&call_id=${UNIQUEID}" > /dev/null &)
 same => n,Wait(1)
 same => n,Dial(PJSIP/6002,30)
 same => n,Hangup()

; Direct dial - proves the link works at all
exten => _600X,1,NoOp(Direct call to ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},20)
 same => n,Hangup()

; Echo test: say something, hear yourself
exten => 200,1,Answer()
 same => n,Echo()
 same => n,Hangup()
